name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gemini-only guard (fails on any forbidden AI SDK, endpoint or key)
        run: npm run check:no-anthropic
      - run: npm run typecheck
      - run: npm test
