<text x="402" y="221" text-anchor="middle" font-size="19" fill="#1f2a44">Follows ~60 artists</text>
<text x="402" y="247" text-anchor="middle" font-size="19" fill="#1f2a44">on Spotify (or the</text>
<text x="402" y="273" text-anchor="middle" font-size="19" fill="#1f2a44">60-artist seed list)</text>
<rect x="567" y="184" width="242" height="112" rx="12" fill="#e3e5fb" stroke="#5b5bd6" stroke-width="2.5"/>
<text x="688" y="221" text-anchor="middle" font-size="19" fill="#1f2a44">Shares a ticket link</text>
<text x="688" y="247" text-anchor="middle" font-size="19" fill="#1f2a44">or poster screenshot</text>
<text x="688" y="273" text-anchor="middle" font-size="19" fill="#1f2a44">(Share-to-Radar)</text>
<rect x="281" y="334" width="242" height="112" rx="12" fill="#fde1d6" stroke="#e8794a" stroke-width="2.5"/>
<text x="402" y="371" text-anchor="middle" font-size="19" fill="#1f2a44">Wakes the scan every</text>
<text x="402" y="397" text-anchor="middle" font-size="19" fill="#1f2a44">5 min, 30 min (Google</text>
<text x="402" y="423" text-anchor="middle" font-size="19" fill="#1f2a44">sweep) and daily</text>
<rect x="567" y="484" width="242" height="112" rx="12" fill="#ffffff" stroke="#2a9bc8" stroke-width="2.5"/>
<text x="688" y="521" text-anchor="middle" font-size="19" fill="#1f2a44">Ticket + news pages:</text>
<text x="688" y="547" text-anchor="middle" font-size="19" fill="#1f2a44">new shows, tiers,</text>
<text x="688" y="573" text-anchor="middle" font-size="19" fill="#1f2a44">prices, dates, posters</text>
<rect x="853" y="634" width="242" height="112" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="974" y="671" text-anchor="middle" font-size="19" fill="#1f2a44">Artist list + aliases,</text>
<text x="974" y="697" text-anchor="middle" font-size="19" fill="#1f2a44">namesake blocks,</text>
<text x="974" y="723" text-anchor="middle" font-size="19" fill="#1f2a44">Bengaluru-first rules</text>
<rect x="853" y="934" width="242" height="112" rx="12" fill="#fbd8e6" stroke="#d6457f" stroke-width="2.5"/>
<text x="974" y="971" text-anchor="middle" font-size="19" fill="#1f2a44">Neon remembers past</text>
<text x="974" y="997" text-anchor="middle" font-size="19" fill="#1f2a44">shows, sources and</text>
<text x="974" y="1023" text-anchor="middle" font-size="19" fill="#1f2a44">alerts (no repeats)</text>
<rect x="1140" y="634" width="242" height="112" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="1261" y="671" text-anchor="middle" font-size="19" fill="#1f2a44">Skips unchanged pages,</text>
<text x="1261" y="697" text-anchor="middle" font-size="19" fill="#1f2a44">keeps only your artists</text>
<text x="1261" y="723" text-anchor="middle" font-size="19" fill="#1f2a44">+ Indian cities</text>
<rect x="1426" y="784" width="242" height="112" rx="12" fill="#d7f3e1" stroke="#34a35f" stroke-width="2.5"/>
<text x="1547" y="821" text-anchor="middle" font-size="19" fill="#1f2a44">Gemini searches Google,</text>
<text x="1547" y="847" text-anchor="middle" font-size="19" fill="#1f2a44">reads pages + posters,</text>
<text x="1547" y="873" text-anchor="middle" font-size="19" fill="#1f2a44">quotes every fact</text>
<rect x="1712" y="634" width="242" height="112" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="1833" y="671" text-anchor="middle" font-size="19" fill="#1f2a44">Truth check + dedupe,</text>
<text x="1833" y="697" text-anchor="middle" font-size="19" fill="#1f2a44">priority P0/P1/P2</text>
<text x="1833" y="723" text-anchor="middle" font-size="19" fill="#1f2a44">(rules, no AI)</text>
<rect x="1712" y="934" width="242" height="112" rx="12" fill="#fbd8e6" stroke="#d6457f" stroke-width="2.5"/>
<text x="1833" y="971" text-anchor="middle" font-size="19" fill="#1f2a44">New show: one email</text>
<text x="1833" y="997" text-anchor="middle" font-size="19" fill="#1f2a44">via Resend. Updates:</text>
<text x="1833" y="1023" text-anchor="middle" font-size="19" fill="#1f2a44">in-app bell only</text>
<rect x="1712" y="1084" width="242" height="112" rx="12" fill="#fde0d9" stroke="#e2533c" stroke-width="2.5"/>
<text x="1833" y="1121" text-anchor="middle" font-size="19" fill="#1f2a44">Opens the email, buys</text>
<text x="1833" y="1147" text-anchor="middle" font-size="19" fill="#1f2a44">before early-bird</text>
<text x="1833" y="1173" text-anchor="middle" font-size="19" fill="#1f2a44">sells out</text>
<text x="24" y="1257" font-size="19" fill="#5b6478">Dashed arrows = data flow. Only one AI box: every price, time, deadline, dedupe and priority decision is plain code, so alerts cannot contain invented facts. Website: poster radar with city dropdown + in-app notification bell.</text>
