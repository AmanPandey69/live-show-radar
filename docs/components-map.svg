<rect x="282" y="184" width="240" height="108" rx="12" fill="#e3e5fb" stroke="#5b5bd6" stroke-width="2.5"/>
<text x="402" y="220" text-anchor="middle" font-size="19" fill="#1f2a44">Follows artists on</text>
<text x="402" y="246" text-anchor="middle" font-size="19" fill="#1f2a44">Spotify, or shares a</text>
<text x="402" y="272" text-anchor="middle" font-size="19" fill="#1f2a44">poster on the site</text>
<rect x="282" y="478" width="240" height="108" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="402" y="514" text-anchor="middle" font-size="19" fill="#1f2a44">Scheduler wakes the</text>
<text x="402" y="540" text-anchor="middle" font-size="19" fill="#1f2a44">scan every 5 min,</text>
<text x="402" y="566" text-anchor="middle" font-size="19" fill="#1f2a44">30 min and daily</text>
<rect x="568" y="332" width="240" height="108" rx="12" fill="#ffffff" stroke="#5b8def" stroke-width="2.5"/>
<text x="688" y="366" text-anchor="middle" font-size="19" fill="#1f2a44">Ticket + news pages:</text>
<text x="688" y="392" text-anchor="middle" font-size="19" fill="#1f2a44">new shows, tiers,</text>
<text x="688" y="418" text-anchor="middle" font-size="19" fill="#1f2a44">prices, dates</text>
<rect x="854" y="478" width="240" height="108" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="974" y="514" text-anchor="middle" font-size="19" fill="#1f2a44">Artist list + aliases,</text>
<text x="974" y="540" text-anchor="middle" font-size="19" fill="#1f2a44">namesake blocks,</text>
<text x="974" y="566" text-anchor="middle" font-size="19" fill="#1f2a44">Bengaluru-first rules</text>
<rect x="1141" y="478" width="240" height="108" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="1261" y="514" text-anchor="middle" font-size="19" fill="#1f2a44">Skips unchanged pages,</text>
<text x="1261" y="540" text-anchor="middle" font-size="19" fill="#1f2a44">filters by artist +</text>
<text x="1261" y="566" text-anchor="middle" font-size="19" fill="#1f2a44">Indian city</text>
<rect x="1427" y="626" width="240" height="108" rx="12" fill="#d7f3e1" stroke="#34a35f" stroke-width="2.5"/>
<text x="1547" y="660" text-anchor="middle" font-size="19" fill="#1f2a44">Gemini searches Google,</text>
<text x="1547" y="686" text-anchor="middle" font-size="19" fill="#1f2a44">extracts show + tiers</text>
<text x="1547" y="712" text-anchor="middle" font-size="19" fill="#1f2a44">with quotes, verifies</text>
<rect x="1713" y="478" width="240" height="108" rx="12" fill="#fdf0c2" stroke="#e0ac1a" stroke-width="2.5"/>
<text x="1833" y="514" text-anchor="middle" font-size="19" fill="#1f2a44">Truth check + dedupe,</text>
<text x="1833" y="540" text-anchor="middle" font-size="19" fill="#1f2a44">then rules set priority</text>
<text x="1833" y="566" text-anchor="middle" font-size="19" fill="#1f2a44">P0 / P1 / P2 (no AI)</text>
<rect x="1713" y="772" width="240" height="108" rx="12" fill="#fbd8e6" stroke="#d6457f" stroke-width="2.5"/>
<text x="1833" y="808" text-anchor="middle" font-size="19" fill="#1f2a44">Email alert with venue,</text>
<text x="1833" y="834" text-anchor="middle" font-size="19" fill="#1f2a44">date + ticket link,</text>
<text x="1833" y="860" text-anchor="middle" font-size="19" fill="#1f2a44">saved in Neon</text>
<rect x="1713" y="920" width="240" height="108" rx="12" fill="#fde0d9" stroke="#e2533c" stroke-width="2.5"/>
<text x="1833" y="954" text-anchor="middle" font-size="19" fill="#1f2a44">Opens the email, buys</text>
<text x="1833" y="980" text-anchor="middle" font-size="19" fill="#1f2a44">before early-bird</text>
<text x="1833" y="1006" text-anchor="middle" font-size="19" fill="#1f2a44">sells out</text>
